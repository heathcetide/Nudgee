name: nudgee
description: "Nudgee — 自律 · 记账 · AI 陪伴"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Networking
  dio: ^5.5.0+1
  web_socket_channel: ^3.0.0

  # Dependency injection (service locator)
  get_it: ^7.7.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.0
  path_provider: ^2.1.4

  # Local database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Crypto / encryption
  encrypt: ^5.0.3
  crypto: ^3.0.3

  # Permissions
  permission_handler: ^11.3.1

  # Logging
  logger: ^2.4.0

  # Theme
  flex_color_scheme: ^7.3.1
  google_fonts: ^6.2.1

  # Utils
  connectivity_plus: ^6.0.3
  uuid: ^4.4.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.5
  gap: ^3.0.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1

  # UI effects
  shimmer: ^3.0.0

  # Event bus
  event_bus: ^2.0.0

  # Bluetooth Low Energy (BLE)
  flutter_blue_plus: 1.31.4

  # Media playback
  just_audio: ^0.9.39
  video_player: ^2.9.1

  # File picking & upload
  file_picker: ^8.0.0
  image_picker: ^1.1.0
  mime: ^1.0.5

  # WebView
  webview_flutter: ^4.7.0

  # Background tasks
  workmanager: ^0.5.2

  # ── Image viewing / editing ──────────────────────────────────────────
  # Image viewing / editing
  extended_image: ^9.0.7
  photo_view: ^0.15.0
  image_editor: ^1.5.1
  image: ^4.3.0
  flutter_image_compress: ^2.3.0
  http_client_helper: ^3.0.0

  # UI / icons
  auto_size_text: ^3.0.0
  icons_plus: ^5.0.0
  flutter_smart_dialog: ^4.9.8+5
  like_button: ^2.0.5
  stroke_text: ^0.0.3
  timelines: ^0.1.0
  tdesign_flutter: ^0.1.6
  flutter_screenutil: ^5.9.3

  # Scrolling
  smooth_scroll_multiplatform: ^1.0.8
  scrollview_observer: ^1.21.2

  # Asset picker
  wechat_assets_picker: ^9.4.0

  # Sharing / device info
  share_plus: ^10.1.2
  device_info_plus: ^11.1.1

  # Cloud storage
  qiniu_flutter_sdk: ^0.6.1

  # Cookies (for timetable login)
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1

  # Action sheet
  adaptive_action_sheet: ^2.0.3
  html: ^0.15.6
  enough_convert: ^1.6.0
  geolocator: ^13.0.2
  url_launcher: ^6.3.1
  open_filex: ^4.7.0
  yaml: ^3.1.4
  package_info_plus: ^8.1.1

  # AI SDK (local package)
  flutter_ai_sdk:
    path: packages/flutter_ai_sdk
  http: ^1.2.0
  rxdart: ^0.27.7
  retry: ^3.1.2
  flutter_markdown: ^0.7.7+1
  flutter_local_notifications: ^19.5.0
  flutter_js: ^0.8.7
  flutter_code_editor: ^0.3.5
  flutter_highlight: ^0.7.0
  sqflite: ^2.3.3+1

  # Voice (ASR / TTS)
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0

  # NOTE: device_info_plus and flutter_webrtc are commented out for now
  # because their Web implementations use package:web which is incompatible
  # with Flutter 3.22.x DDC. They will be added back when upgrading Flutter
  # or when Web support is needed for those features.
  # device_info_plus: ^10.1.2
  # flutter_webrtc: ^0.12.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Code generation
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10
  flutter_launcher_icons: ^0.14.4

# Force older permission_handler_html that uses dart:html (not package:web)
# to be compatible with Flutter 3.22.x DDC compiler on Web.
dependency_overrides:
  permission_handler_html: 0.1.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/config/
    - assets/agents/
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/logo.png"
  macos:
    generate: true
    image_path: "assets/images/logo.png"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
