allprojects {
    repositories {
        maven { url 'https://storage.flutter-io.cn/download.flutter.io' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// Fix: 为引用 flutter.xxx 的旧插件注入 flutter 扩展属性
subprojects { subproject ->
    subproject.ext {
        flutter = [
            compileSdkVersion: 36,
            minSdkVersion: 21,
            targetSdkVersion: 34,
            ndkVersion: ""
        ]
    }
}

// Fix: 为缺少 namespace 的旧插件注入 namespace（AGP 8+ 要求）
subprojects { subproject ->
    subproject.plugins.withId('com.android.library') {
        def android = subproject.extensions.findByName('android')
        if (android != null && android.namespace == null) {
            def manifest = subproject.file('src/main/AndroidManifest.xml')
            if (manifest.exists()) {
                def pkg = new groovy.xml.XmlSlurper().parse(manifest).@package.toString()
                if (pkg) {
                    android.namespace = pkg
                    println "Injected namespace '${pkg}' into ${subproject.name}"
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
