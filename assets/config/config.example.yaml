storage:
  kind: qiniu
  qiniuAccessKey: YOUR_ACCESS_KEY
  qiniuSecretKey: YOUR_SECRET_KEY
  qiniuBucket: YOUR_BUCKET
  qiniuDomain: https://your-cdn-domain.com
  qiniuPrivate: false
  qiniuRegion: huanan

ai:
  provider: deepseek          # openai | anthropic | googleAI | ollama | mistral | xai | deepseek | openrouter
  apiKey: YOUR_API_KEY
  model: deepseek-chat
  baseUrl: https://api.deepseek.com    # optional, only for custom endpoints
  systemPrompt: "You are a helpful assistant."

# Cloud sandbox for remote code execution (optional)
# When configured, AI can run Node.js/Python/Go code on your server.
# Server API: POST /api/sandbox/execute { language, code, timeout }
#             → { stdout, stderr, exitCode, duration }
sandbox:
  apiBaseUrl: https://your-sandbox-server.com

# Git provider configuration (optional)
# Enables AI to read/write repositories, create branches, open PRs, etc.
# Supports: github | gitea | gitlab
# For GitHub: create a Personal Access Token at https://github.com/settings/tokens
#   (needs repo scope for private repos, public_repo for public only)
# For Gitea: create a token at Settings > Applications > Generate New Token
# For GitLab: create a token at Settings > Access Tokens (api scope)
git:
  provider: github
  token: ghp_your_personal_access_token
  # apiUrl: https://api.github.com    # auto-detected from provider
  # defaultOwner: yourusername         # default owner for repo operations
